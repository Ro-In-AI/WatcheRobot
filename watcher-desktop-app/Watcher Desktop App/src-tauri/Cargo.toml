[package]
name = "watcher-desktop"
version = "0.1.0"
description = "Unified Tauri client for OpenClaw setup, channel config and Watcher Server runtime"
authors = ["Codex"]
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "watcher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
json5 = "0.4"
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.8.2", features = [] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
